<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="eckEmKRcxO2-v0_uGxKgiAfYmNxzAT6_36wGXXYYWFs" />
    <title>LTC HUB — Lumen Technologies Co.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-effects">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
        <div class="grid-overlay"></div>
    </div>

    <main class="container">

        <!-- HEADER -->
        <header class="header">
            <div class="brand">
                <div class="brand-mark">
                    <div class="brand-icon">
                        <i class="fas fa-bolt"></i>
                    </div>
                </div>
                <div class="brand-text">
                    <h1>LTC<span class="dot">.</span>HUB</h1>
                    <p class="brand-sub">Lumen Technologies Co.</p>
                </div>
            </div>
            <p class="tagline">دسترسی یکپارچه به سرویس‌ها و زیرمجموعه‌های شرکت</p>
        </header>

        <!-- LINKS -->
        <section class="links-section">
            <div id="link-list" class="link-grid">
                <!-- کارت‌ها توسط JS ساخته می‌شوند -->
            </div>
            <div id="empty-state" class="empty-state" style="display: none;">
                <div class="empty-icon">
                    <i class="fas fa-sitemap"></i>
                </div>
                <p>در حال حاضر مسیریابی فعالی وجود ندارد.</p>
            </div>
        </section>

        <!-- CONTACT -->
        <section class="contact-section">
            <div class="contact-card">
                <div class="contact-left">
                    <div class="contact-icon">
                        <i class="fas fa-headset"></i>
                    </div>
                    <div class="contact-meta">
                        <span class="contact-label">ارتباط با مدیریت</span>
                        <span class="contact-number" dir="ltr">۰۹۳۶ ۲۳۳ ۵۲۶۶</span>
                    </div>
                </div>
                <a href="tel:09362335266" class="call-btn">
                    <i class="fas fa-phone"></i>
                    <span>تماس</span>
                </a>
            </div>
        </section>

        <!-- FOOTER -->
        <footer class="footer">
            <p class="footer-copy">
                &copy; ۲۰۲۶ <strong>Lumen Technologies Co.</strong>
            </p>
            <p class="footer-credit">طراحی و توسعه با دقت</p>
        </footer>

    </main>

    <script src="script.js"></script>
</body>
</html>
