<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظرسنجی - LTC</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Vazirmatn', Tahoma, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; line-height: 1.6; }
    .survey-container { background: white; border-radius: 30px; box-shadow: 0 25px 50px rgba(0,0,0,0.2); overflow: hidden; width: 100%; max-width: 800px; }
    .survey-header { background: linear-gradient(135deg, #007aff 0%, #0056cc 100%); color: white; padding: 40px 30px; text-align: center; }
    .survey-title { font-size: 32px; font-weight: 800; margin-bottom: 10px; }
    .survey-subtitle { font-size: 18px; opacity: 0.9; }
    .survey-content { padding: 40px 30px; }
    .form-group { margin-bottom: 30px; }
    .form-label { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; color: #1d1d1f; font-weight: 600; font-size: 17px; }
    .form-input { width: 100%; padding: 18px 20px; border: 2px solid #e0e0e0; border-radius: 15px; font-family: inherit; font-size: 16px; background: #f8f9fa; }
    .form-input:focus { border-color: #007aff; background: white; outline: none; }
    textarea.form-input { min-height: 120px; resize: vertical; }
    .rating-section { text-align: center; margin: 40px 0; }
    .rating-title { font-size: 20px; margin-bottom: 25px; font-weight: 600; }
    .rating-stars { display: flex; justify-content: center; gap: 10px; direction: ltr; }
    .star-input { display: none; }
    .star-label { font-size: 40px; color: #ddd; cursor: pointer; }
    .star-label:hover, .star-label:hover ~ .star-label { color: #ffc107 !important; }
    .star-input:checked ~ .star-label { color: #ddd; }
    .star-input:checked + .star-label { color: #ffc107; }
    .rating-text { margin-top: 15px; color: #666; font-size: 14px; }
    .form-actions { display: flex; gap: 20px; margin-top: 40px; flex-wrap: wrap; }
    .submit-btn { flex: 1; min-width: 200px; padding: 20px; background: linear-gradient(135deg, #34c759, #2aa44f); color: white; border: none; border-radius: 15px; font-size: 18px; font-weight: 700; cursor: pointer; }
    .back-btn { flex: 1; min-width: 200px; padding: 20px; background: #f8f9fa; color: #555; border: 2px solid #e0e0e0; border-radius: 15px; font-size: 18px; font-weight: 600; text-decoration: none; text-align: center; }
    .survey-footer { background: #f8f9fa; padding: 25px 30px; text-align: center; border-top: 2px solid #e9ecef; }
    .contact-link { color: #007aff; text-decoration: none; font-weight: 600; }
    @media (max-width: 768px) { .submit-btn, .back-btn { min-width: 100%; } }
  </style>
</head>
<body>
<div class="survey-container">
  <div class="survey-header">
    <h1 class="survey-title">نظرسنجی LTC</h1>
    <p class="survey-subtitle">نظرات شما برای بهبود کیفیت خدمات ضروری است</p>
  </div>
  <div class="survey-content">
    <form id="survey-form">
      <div class="form-group">
        <label class="form-label">نام و نام خانوادگی</label>
        <input type="text" name="name" class="form-input" placeholder="مثال: محمد حسین مهدوی" required>
      </div>
      <div class="form-group">
        <label class="form-label">شماره تماس (اختیاری)</label>
        <input type="tel" name="phone" class="form-input" placeholder="مثال: 09362335266">
      </div>
      <div class="form-group">
        <label class="form-label">نظر، نقاط قوت و پیشنهادات</label>
        <textarea name="feedback" class="form-input" placeholder="نظرات و پیشنهادات خود را با ما در میان بگذارید..." required></textarea>
      </div>
      <div class="rating-section">
        <div class="rating-title">به طور کلی از خدمات ما چقدر راضی بودید؟</div>
        <div class="rating-stars">
          <input type="radio" id="star5" name="rate" value="5" class="star-input" required>
          <label for="star5" class="star-label">★</label>
          <input type="radio" id="star4" name="rate" value="4" class="star-input">
          <label for="star4" class="star-label">★</label>
          <input type="radio" id="star3" name="rate" value="3" class="star-input">
          <label for="star3" class="star-label">★</label>
          <input type="radio" id="star2" name="rate" value="2" class="star-input">
          <label for="star2" class="star-label">★</label>
          <input type="radio" id="star1" name="rate" value="1" class="star-input">
          <label for="star1" class="star-label">★</label>
        </div>
        <div class="rating-text"><span id="rating-text">لطفاً امتیاز دهید</span></div>
      </div>
      <div class="form-actions">
        <button type="submit" class="submit-btn">ارسال نظرسنجی</button>
        <a href="index.html" class="back-btn">بازگشت به هاب</a>
      </div>
    </form>
  </div>
  <div class="survey-footer">
    <p>با تشکر از مشارکت شما</p>
    <a href="tel:09362335266" class="contact-link">تماس با مدیر: 09362335266</a>
  </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
  const form = document.getElementById('survey-form');
  const ratingText = document.getElementById('rating-text');
  const stars = document.querySelectorAll('.star-input');
  const ratingMessages = {1:'خیلی ضعیف',2:'ضعیف',3:'متوسط',4:'خوب',5:'عالی'};
  stars.forEach(star => {
    star.addEventListener('change', function() {
      ratingText.textContent = ratingMessages[this.value];
      ratingText.style.color = '#34c759';
    });
  });
  form.addEventListener('submit', function(e) {
    e.preventDefault();
    const formData = new FormData(form);
    const name = formData.get('name');
    const phone = formData.get('phone') || 'ثبت نشده';
    const feedback = formData.get('feedback');
    const rate = formData.get('rate');
    const message = `🌟 نظرسنجی \n\n` + `👤 نام: ${name}\n` + `📞 تماس: ${phone}\n` + `⭐ امتیاز: ${rate} از 5\n` + `📝 نظر: ${feedback}\n\n` + `⏰ زمان: ${new Date().toLocaleString('fa-IR')}`;
    const token = 'bot425913:7d5eec5b-c6c8-4bd9-9500-95e1d5a3bde4';
    const chat_id = 10977332;
    const url = `https://eitaayar.ir/api/${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(message)}`;
    const iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.src = url;
    document.body.appendChild(iframe);
    setTimeout(() => {
      document.body.removeChild(iframe);
      alert('✅ نظرسنجی شما با موفقیت ثبت شد!');
      form.reset();
      ratingText.textContent = 'لطفاً امتیاز دهید';
      ratingText.style.color = '#666';
    }, 1500);
  });
});
</script>
</body>
</html>
